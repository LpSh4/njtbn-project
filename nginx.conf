events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 1. HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name ryban.ru www.ryban.ru api.ryban.ru;
        return 301 https://$host$request_uri;
    }

    # 2. FRONTEND Server (ryban.ru)
    server {
        listen 443 ssl;
        server_name ryban.ru www.ryban.ru;

        ssl_certificate     /etc/nginx/certs/ryban.ru.crt;
        ssl_certificate_key /etc/nginx/certs/ryban.ru.key;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /public/ {
            try_files $uri =404;
        }
    }

    # 3. API Server (api.ryban.ru)
    server {
        listen 443 ssl;
        server_name api.ryban.ru;

        ssl_certificate     /etc/nginx/certs/ryban.ru.crt;
        ssl_certificate_key /etc/nginx/certs/ryban.ru.key;

        location / {
            # Handle Preflight (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://ryban.ru' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE, PUT' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Proxy to your Fastify backend
            # Use the actual IP of your backend container/server
            proxy_pass http://89.109.16.50:85;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Authorization;
        }
    }
}