events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server {
        listen 80;
        server_name ryban.ru www.ryban.ru; # Coolify will handle subdomains

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}