events { }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name ryban.ru www.ryban.ru;
        return 301 https://ryban.ru$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ryban.ru;

        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/ryban.ru.crt;
        ssl_certificate_key /etc/nginx/certs/ryban.ru.key;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        keepalive_timeout 70;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_stapling on;
        ssl_trusted_certificate /etc/nginx/certs/ca.crt;

        resolver 8.8.8.8;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /public/ {
            try_files $uri =404;
        }

        # Inside the server block for api.ryban.ru
        location / {
            # 1. Handle the Preflight (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://ryban.ru' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, DELETE, PUT' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://127.0.0.1:3000; # Or your backend container IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 2. Ensure headers from Fastify aren't stripped
            proxy_pass_header Authorization;
        }
}}